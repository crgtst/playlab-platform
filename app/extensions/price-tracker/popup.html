<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>PlayLab Price Tracker</title>
    <style>
      body { font: 14px system-ui, sans-serif; margin: 12px; min-width: 280px; }
      h1 { font-size: 16px; margin: 0 0 8px; }
      ul { list-style: none; padding: 0; margin: 0 0 8px; }
      li { padding: 4px 0; border-bottom: 1px solid #ddd; }
      .muted { color: #666; }
    </style>
  </head>
  <body>
    <h1>Tracked prices</h1>
    <p id="empty" class="muted" data-testid="tracker-empty" hidden>Visit a PlayLab Shop product page to start tracking.</p>
    <ul id="list" data-testid="tracker-list"></ul>
    <button type="button" id="clear" data-testid="tracker-clear">Clear history</button>
    <script src="popup.js"></script>
  </body>
</html>
