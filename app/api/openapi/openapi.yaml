openapi: 3.0.3
info:
  title: PlayLab Shop API
  version: 1.0.0
  description: |
    REST API for PlayLab Shop, a practice e-commerce site built to be tested with Playwright.

    * All money values are integer cents in EUR.
    * Every error uses the same shape: `{ "error": { "code", "message", "details", "correlationId" } }`.
    * Every response has an `X-Correlation-Id` header. Send your own (1 to 64 of `A-Z a-z 0-9 - _`) to have it echoed;
      otherwise, or if it is invalid, the API generates a UUID. Errors repeat it as `error.correlationId`.
      With test hooks on, `GET /test/logs?correlationId=` returns that request's redacted log line.
    * Authenticate with `Authorization: Bearer <accessToken>` or the `session` cookie set by `/auth/login`.
    * Access tokens expire after 15 minutes; use `/auth/refresh` to get a new one.
    * Rate limit: 100 requests a minute per user (or per IP for guests). Over the limit returns 429 with `Retry-After`.
    * Test hooks under `/test/*` exist only when the API runs with `TEST_HOOKS=true`.
    * Test sessions: `POST /test/sessions` returns an id. Requests that send it as `X-Test-Session` (or the
      `test_session` cookie) get that session's own defects, clock, latency and chaos rules and rate-limit counters;
      hook calls with it change only that session. Requests with no session use the global state.
    * Live order status: WebSocket at `ws://<host>/ws/orders` (not describable in OpenAPI).
      Authenticate with the `session` cookie or `?token=<accessToken>`; without either the upgrade gets 401.
      Messages: `{"type":"hello","userId","role"}` on connect, then
      `{"type":"order.status","orderId","number","status","from","at"}` for your orders (admin and support: every order).
      Send `{"type":"ping"}` to get `{"type":"pong"}`.
    * Live stock: Server-Sent Events at `GET /api/v1/stock/stream`.
servers:
  - url: /api/v1
    description: Versioned API
tags:
  - name: Health
  - name: Auth
  - name: Products
  - name: Cart
  - name: Orders
  - name: Addresses
  - name: Payments
  - name: Users
  - name: Wishlist
  - name: Stores
  - name: Admin
    description: Admin-only order management. Support users can read orders but get 403 on every change.
  - name: Test hooks
    description: Only available when `TEST_HOOKS=true`. Paths are relative to the server root, not `/api/v1`.

paths:
  /health:
    get:
      tags: [Health]
      summary: Readiness check (API, database and web app)
      responses:
        '200':
          description: Everything is up
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          description: At least one dependency is down
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /health/live:
    get:
      tags: [Health]
      summary: Liveness check (API and database only)
      responses:
        '200':
          description: API and database are up
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          description: Database is down
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

  /auth/register:
    post:
      tags: [Auth]
      summary: Register a customer account
      description: Sends a confirmation email to the test mailbox. Does not log the user in.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserEnvelope' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/confirm-email:
    post:
      tags: [Auth]
      summary: Confirm an email address with the token from the confirmation email
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenRequest' }
      responses:
        '200':
          description: Email confirmed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /auth/login:
    post:
      tags: [Auth]
      summary: Log in
      description: |
        Returns tokens and sets `session` and `refresh_token` cookies. Any guest cart (cookie `cart_id`)
        is merged into the account cart. After 5 failed attempts the account is locked for 15 minutes (423).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Logged in
          headers:
            Set-Cookie:
              schema: { type: string }
              description: '`session` (access token) and `refresh_token` cookies, both httpOnly'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '423':
          description: Account locked
          headers:
            Retry-After:
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Exchange a refresh token for a new access token
      description: Reads the refresh token from the body or the `refresh_token` cookie. Refresh tokens are single use (rotated).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: New tokens
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/logout:
    post:
      tags: [Auth]
      summary: Log out
      description: Revokes the refresh token and clears the session, refresh and cart cookies.
      responses:
        '204':
          description: Logged out
  /auth/me:
    get:
      tags: [Auth]
      summary: The current user
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request a password reset link
      description: Always returns 202. If the account exists, a reset link (valid for 1 hour) is sent to the test mailbox.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Set a new password with a reset token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, minLength: 8, maxLength: 128 }
      responses:
        '200':
          description: Password changed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /products:
    get:
      tags: [Products]
      summary: Search, filter, sort and page through products
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 200 }, description: Case-insensitive match on name or description }
        - { name: category, in: query, schema: { type: string }, description: Category slug }
        - { name: minPrice, in: query, schema: { type: number, minimum: 0 }, description: Minimum price in euros (inclusive) }
        - { name: maxPrice, in: query, schema: { type: number, minimum: 0 }, description: Maximum price in euros (inclusive) }
        - name: sort
          in: query
          schema: { type: string, enum: [name_asc, name_desc, price_asc, price_desc, newest], default: name_asc }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 48, default: 12 } }
      responses:
        '200':
          description: A page of products
          headers:
            Link:
              schema: { type: string }
              description: RFC 8288 links with rel first, prev, next and last
            X-Total-Count:
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductList' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      tags: [Products]
      summary: Create a product (admin)
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /products/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Products]
      summary: Get one product
      parameters:
        - { name: If-None-Match, in: header, schema: { type: string } }
      responses:
        '200':
          description: The product
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductEnvelope' }
        '304':
          description: Not modified (ETag matched)
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Products]
      summary: Replace a product (admin)
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
    patch:
      tags: [Products]
      summary: Update some fields of a product (admin)
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductPatch' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Products]
      summary: Delete a product (admin)
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '204':
          description: Deleted
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /products/{productId}/reviews:
    parameters:
      - { name: productId, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Products]
      summary: Reviews for a product, newest first
      description: Review text is returned exactly as written. Render it as text, never as HTML.
      responses:
        '200':
          description: Reviews
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewList' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Products]
      summary: Review a product (one review per user per product)
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating, title]
              properties:
                rating: { type: integer, minimum: 1, maximum: 5 }
                title: { type: string, maxLength: 100 }
                body: { type: string, maxLength: 1000 }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/Review' }
                  meta: { $ref: '#/components/schemas/ReviewMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /stock/stream:
    get:
      tags: [Products]
      summary: Live stock levels (Server-Sent Events)
      description: |
        A `text/event-stream`. First an `event: snapshot` with `{ products: [{ productId, stock }], at }`,
        then an `event: stock` with `{ productId, stock, at }` whenever a watched product's stock changes
        (orders, admin edits), and a `: ping` comment every 15 s. After `POST /test/reset` a fresh snapshot is sent.
      parameters:
        - name: ids
          in: query
          description: Comma-separated product ids to watch (up to 100). Omit to watch every product.
          schema: { type: string, example: '1,2,3' }
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema: { type: string, example: "event: stock\ndata: {\"productId\":4,\"stock\":7,\"at\":\"2026-10-20T12:00:00.000Z\"}\n\n" }
        '422': { $ref: '#/components/responses/ValidationError' }

  /stores:
    get:
      tags: [Stores]
      summary: List stores, optionally searching by town or name
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
      responses:
        '200':
          description: Stores
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Store' }
                  meta:
                    type: object
                    properties:
                      count: { type: integer }
        '422': { $ref: '#/components/responses/ValidationError' }
  /stores/nearest:
    get:
      tags: [Stores]
      summary: The stores nearest to a position, closest first
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: lng, in: query, required: true, schema: { type: number, minimum: -180, maximum: 180 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 12, default: 3 } }
      responses:
        '200':
          description: Nearest stores
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/Store'
                        - type: object
                          required: [distanceKm]
                          properties:
                            distanceKm: { type: number }
                  meta:
                    type: object
                    properties:
                      lat: { type: number }
                      lng: { type: number }
                      count: { type: integer }
        '422': { $ref: '#/components/responses/ValidationError' }
  /offers:
    get:
      tags: [Cart]
      summary: Public, currently active discount codes
      responses:
        '200':
          description: Offers
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [code, description, type, value, minSpendCents]
                      properties:
                        code: { type: string }
                        description: { type: string }
                        type: { type: string, enum: [percent, fixed] }
                        value: { type: integer }
                        minSpendCents: { type: integer }

  /categories:
    get:
      tags: [Products]
      summary: List categories
      responses:
        '200':
          description: Categories
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/CategoryWithCount' }

  /cart:
    get:
      tags: [Cart]
      summary: The current cart
      description: Logged-in users get their account cart; guests get the cart in the `cart_id` cookie.
      responses:
        '200':
          description: Cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [Cart]
      summary: Empty the cart
      responses:
        '200':
          description: Empty cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
  /cart/items:
    post:
      tags: [Cart]
      summary: Add a product to the cart
      description: Adds to the existing quantity if the product is already in the cart.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId]
              properties:
                productId: { type: integer }
                quantity: { type: integer, minimum: 1, maximum: 99, default: 1 }
      responses:
        '201':
          description: Updated cart
          headers:
            Set-Cookie:
              schema: { type: string }
              description: '`cart_id` cookie for guests'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /cart/items/{productId}:
    parameters:
      - { name: productId, in: path, required: true, schema: { type: integer } }
    patch:
      tags: [Cart]
      summary: Set the quantity of a cart item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity: { type: integer, minimum: 1, maximum: 99 }
      responses:
        '200':
          description: Updated cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Cart]
      summary: Remove an item from the cart
      responses:
        '200':
          description: Updated cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '404': { $ref: '#/components/responses/NotFound' }
  /cart/discount:
    post:
      tags: [Cart]
      summary: Apply a discount code
      description: |
        Codes are case-insensitive and spaces are ignored. Only one code per order.
        Error codes: `DISCOUNT_UNKNOWN`, `DISCOUNT_EXPIRED`, `DISCOUNT_NOT_ACTIVE`, `DISCOUNT_ALREADY_USED`,
        `DISCOUNT_MIN_SPEND`, `DISCOUNT_CART_EMPTY` (all 422) and `DISCOUNT_ONE_PER_ORDER` (409).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, example: save10 }
      responses:
        '200':
          description: Cart with the discount applied
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Cart]
      summary: Remove the applied discount code
      responses:
        '200':
          description: Cart without a discount
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }

  /orders:
    post:
      tags: [Orders]
      summary: Place an order from the current cart
      description: |
        Prices always come from the database; any price sent by the client is ignored.
        Test cards: `4242 4242 4242 4242` succeeds, `4000 0000 0000 0002` is declined (402),
        `4000 0000 0000 0119` times out (504 after a delay). No order is created on 402 or 504 and the cart is kept.
        If prices changed since items were added, returns 409 `PRICE_CHANGED` unless `acceptPriceChanges` is true.
        Instead of card details you can send `paymentIntentId` for an intent confirmed in the payment iframe:
        it must be yours, succeeded, unused and for the current total (409 `PAYMENT_NOT_COMPLETED`,
        `PAYMENT_ALREADY_USED` or `PAYMENT_AMOUNT_MISMATCH` otherwise; 402 if it was declined).
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          schema: { type: string, maxLength: 255 }
          description: Re-sending the same key returns the original order (200) instead of creating another.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderRequest' }
      responses:
        '200':
          description: Replay of an earlier request with the same Idempotency-Key
          headers:
            Idempotent-Replayed:
              schema: { type: string, enum: ['true'] }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderEnvelope' }
        '201':
          description: Order created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402':
          description: Card declined
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '504':
          description: Payment provider timed out
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    get:
      tags: [Orders]
      summary: List orders, newest first
      description: Customers see only their own orders. Admin and support users see every order and can filter them.
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrderStatusFilter' }
        - { $ref: '#/components/parameters/OrderSearch' }
        - { $ref: '#/components/parameters/OrderSort' }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Orders
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /orders/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Orders]
      summary: Get one order
      description: Returns 404 (not 403) for another customer's order, so ids are not leaked.
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200':
          description: The order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /addresses/suggest:
    get:
      tags: [Addresses]
      summary: Address autocomplete
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 10, default: 5 } }
      responses:
        '200':
          description: Matching addresses
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AddressSuggestion' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /config:
    get:
      tags: [Health]
      summary: Public runtime settings for the web app
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema:
                type: object
                required: [paymentFrameUrl, testHooks, currencies, bugs]
                properties:
                  paymentFrameUrl: { type: string, format: uri }
                  testHooks: { type: boolean }
                  currencies:
                    type: object
                    description: Display conversion rates from EUR. Every amount in the API is EUR.
                    additionalProperties: { type: number }
                    example: { EUR: 1, GBP: 0.85 }
                  bugs:
                    type: array
                    description: Bug-mode defects currently on (always empty unless TEST_HOOKS=true)
                    items: { type: string }

  /orders/export.csv:
    get:
      tags: [Admin]
      summary: Download orders as CSV (admin)
      description: One row per order plus a header row. Honours the same `status`, `q` and `sort` filters as `GET /orders`.
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrderStatusFilter' }
        - { $ref: '#/components/parameters/OrderSearch' }
        - { $ref: '#/components/parameters/OrderSort' }
      responses:
        '200':
          description: CSV file
          headers:
            Content-Disposition:
              schema: { type: string, example: 'attachment; filename="orders-2026-10-20.csv"' }
          content:
            text/csv:
              schema:
                type: string
                example: "number,created_at,customer_email,status,items,subtotal,discount_code,discount,vat,delivery,total,currency\r\n"
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /orders/bulk-status:
    post:
      tags: [Admin]
      summary: Change the status of several orders at once (admin)
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, status]
              properties:
                ids:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items: { type: integer }
                status: { $ref: '#/components/schemas/OrderStatus' }
      responses:
        '200':
          description: Updated orders
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Order' }
                  meta:
                    type: object
                    properties:
                      updated: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /orders/{id}/status:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    patch:
      tags: [Admin]
      summary: Change an order's status (admin)
      description: Emits an `orderStatusChanged` event (delivered over WebSocket from Phase 3).
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/OrderStatus' }
      responses:
        '200':
          description: Updated order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /orders/{id}/tracking:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Orders]
      summary: Parcel tracking timeline for an order
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200':
          description: Tracking
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Tracking' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /payments/intents:
    post:
      tags: [Payments]
      summary: Create a payment intent for the current cart total
      description: |
        Returns a `frameUrl` for the hosted payment iframe (served on the API origin, cross-origin to the shop).
        The frame confirms the intent and reports the result to the parent window with
        `postMessage({ type: 'playlab-payment', status, intentId, ... })`. Then pay with `POST /orders { paymentIntentId }`.
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '201':
          description: Intent
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/PaymentIntent'
                      - type: object
                        required: [clientSecret, frameUrl]
                        properties:
                          clientSecret: { type: string }
                          frameUrl: { type: string, format: uri }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /payments/intents/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Payments]
      summary: Get one of your payment intents
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200':
          description: Intent
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/PaymentIntent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /users/me/avatar:
    post:
      tags: [Users]
      summary: Upload your avatar
      description: PNG or JPG, at most 2 MB. The type is detected from the file contents, not its name or MIME type.
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [avatar]
              properties:
                avatar: { type: string, format: binary }
      responses:
        '201':
          description: Uploaded
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [avatarUrl, contentType, sizeBytes]
                    properties:
                      avatarUrl: { type: string }
                      contentType: { type: string, enum: [image/png, image/jpeg] }
                      sizeBytes: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413':
          description: File too large
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '415':
          description: Not a PNG or JPG
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Users]
      summary: Remove your avatar
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '204':
          description: Removed
        '401': { $ref: '#/components/responses/Unauthorized' }
  /users/{id}/avatar:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Users]
      summary: A user's avatar image
      responses:
        '200':
          description: Image
          headers:
            ETag:
              schema: { type: string }
          content:
            image/png:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
        '304':
          description: Not modified
        '404': { $ref: '#/components/responses/NotFound' }

  /wishlist:
    get:
      tags: [Wishlist]
      summary: Your wishlist, in your chosen order
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200':
          description: Wishlist
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Wishlist' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /wishlist/items:
    post:
      tags: [Wishlist]
      summary: Add a product to your wishlist (at the end)
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId]
              properties:
                productId: { type: integer }
      responses:
        '201':
          description: Wishlist
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Wishlist' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /wishlist/items/{productId}:
    parameters:
      - { name: productId, in: path, required: true, schema: { type: integer } }
    delete:
      tags: [Wishlist]
      summary: Remove a product from your wishlist
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        '200':
          description: Wishlist
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Wishlist' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /wishlist/order:
    put:
      tags: [Wishlist]
      summary: Reorder your wishlist
      description: '`productIds` must list exactly the products currently in the wishlist, in the new order.'
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productIds]
              properties:
                productIds:
                  type: array
                  items: { type: integer }
      responses:
        '200':
          description: Wishlist
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Wishlist' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ---- Hosted payment frame: served from the server root (/pay/*), not /api/v1 ----
  /pay/frame:
    get:
      tags: [Payments]
      summary: 'GET /pay/frame - the hosted payment page loaded in the checkout iframe'
      servers: [{ url: / }]
      parameters:
        - { name: intent, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: secret, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: HTML page. Sends `Content-Security-Policy frame-ancestors` for the shop origin.
          content:
            text/html:
              schema: { type: string }
  /pay/intents/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Payments]
      summary: 'GET /pay/intents/{id} - intent status, authorised by its client secret'
      servers: [{ url: / }]
      parameters:
        - { name: secret, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: Intent
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/PaymentIntent' }
        '404': { $ref: '#/components/responses/NotFound' }
  /pay/intents/{id}/confirm:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Payments]
      summary: 'POST /pay/intents/{id}/confirm - charge a card for this intent (called from inside the frame)'
      description: Test cards as for `POST /orders`. A declined or timed-out intent can be retried.
      servers: [{ url: / }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientSecret, cardNumber, expiry, cvc, nameOnCard]
              properties:
                clientSecret: { type: string }
                cardNumber: { type: string }
                expiry: { type: string, example: '12/30' }
                cvc: { type: string }
                nameOnCard: { type: string }
      responses:
        '200':
          description: Payment succeeded
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/PaymentIntent' }
        '402':
          description: Card declined
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '504':
          description: Payment provider timed out
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ---- Test hooks: served from the server root (/test/*), not /api/v1 ----
  /metrics:
    get:
      tags: [Health]
      summary: 'GET /metrics - Prometheus metrics'
      description: |
        Prometheus text format. Not under `/api/v1`, so never rate limited, and never affected by latency or chaos
        rules. Includes `http_request_duration_seconds` (by `method`, matched `route` and `status`; `route="unmatched"`
        when no route matched), `playlab_orders_created_total`, `playlab_payments_declined_total`,
        `playlab_defects_active`, `playlab_db_pool_connections{state}` and the standard Node.js process metrics.
      servers: [{ url: / }]
      responses:
        '200':
          description: Metrics
          content:
            text/plain:
              schema: { type: string }
  /test:
    get:
      tags: [Test hooks]
      summary: 'GET /test - lists the available hooks and fixtures'
      servers: [{ url: / }]
      responses:
        '200':
          description: Hook list
          content:
            application/json:
              schema: { type: object }
        '404': { $ref: '#/components/responses/NotFound' }
  /test/reset:
    post:
      tags: [Test hooks]
      summary: 'POST /test/reset - truncate every table and reload the base seed'
      servers: [{ url: / }]
      responses:
        '200':
          description: Reset
          content:
            application/json:
              schema:
                type: object
                required: [status, durationMs]
                properties:
                  status: { type: string, enum: [reset] }
                  durationMs: { type: integer }
        '404': { $ref: '#/components/responses/NotFound' }
  /test/sessions:
    post:
      tags: [Test hooks]
      summary: 'POST /test/sessions - start an isolated test session'
      description: |
        Send the id as `X-Test-Session` (or rely on the `test_session` cookie this sets). That request then uses the
        session's own defects, clock offset, latency and chaos rules and rate-limit counters, and hook calls change
        only the session. Database rows stay shared. A session unused for `idleTimeoutMs` (1 hour by default) is
        forgotten: hook calls naming it return 404 `TEST_SESSION_NOT_FOUND`, and other requests use the global state.
        `POST /test/reset` ends every session. The payment frame gets the session from its URL (`testSession`).
      servers: [{ url: / }]
      responses:
        '201':
          description: Session started
          headers:
            Set-Cookie:
              schema: { type: string, example: 'test_session=3f2b8c1e-6a0d-4c4e-9a52-1b7e2f0c9d11; Path=/; HttpOnly; SameSite=Lax' }
          content:
            application/json:
              schema:
                type: object
                required: [id, idleTimeoutMs]
                properties:
                  id: { type: string, format: uuid }
                  idleTimeoutMs: { type: integer }
        '404': { $ref: '#/components/responses/NotFound' }
  /test/seed:
    post:
      tags: [Test hooks]
      summary: 'POST /test/seed - create named fixtures'
      servers: [{ url: / }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fixtures]
              properties:
                fixtures:
                  type: array
                  items:
                    type: string
                    enum:
                      - customer-with-orders
                      - orders-for-admin
                      - customer-with-wishlist
                      - customer-with-avatar
                      - product-with-reviews
                      - out-of-stock-product
                      - low-stock-product
                      - expired-discount
                      - future-discount
                      - single-use-discount
                      - used-discount
                      - min-spend-discount
      responses:
        '201':
          description: The created fixtures, keyed by fixture name
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: object, additionalProperties: true }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /test/users:
    post:
      tags: [Test hooks]
      summary: 'POST /test/users - create a throwaway, already-confirmed user and return its tokens'
      servers: [{ url: / }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { type: string, enum: [customer, admin, support], default: customer }
                name: { type: string }
                email: { type: string, format: email }
      responses:
        '201':
          description: Created user
          content:
            application/json:
              schema:
                type: object
                required: [user, password, accessToken, refreshToken]
                properties:
                  user: { type: object }
                  password: { type: string }
                  accessToken: { type: string }
                  refreshToken: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /test/mailbox/{email}:
    parameters:
      - { name: email, in: path, required: true, schema: { type: string } }
    get:
      tags: [Test hooks]
      summary: 'GET /test/mailbox/{email} - emails the app "sent" to this address, newest first'
      servers: [{ url: / }]
      responses:
        '200':
          description: Emails
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Email' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Test hooks]
      summary: 'DELETE /test/mailbox/{email} - empty this mailbox'
      servers: [{ url: / }]
      responses:
        '204':
          description: Emptied
  /test/clock:
    get:
      tags: [Test hooks]
      summary: "GET /test/clock - the server's current notion of now"
      servers: [{ url: / }]
      responses:
        '200':
          description: Clock state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClockState' }
    post:
      tags: [Test hooks]
      summary: "POST /test/clock - set the server's now (empty body resets it)"
      servers: [{ url: / }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: Send at most one field.
              properties:
                now: { type: string, format: date-time }
                offsetMs: { type: integer }
                advanceMs: { type: integer }
      responses:
        '200':
          description: Clock state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClockState' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /test/latency:
    get:
      tags: [Test hooks]
      summary: 'GET /test/latency - list latency rules'
      servers: [{ url: / }]
      responses:
        '200':
          description: Rules
          content:
            application/json:
              schema: { type: object }
    post:
      tags: [Test hooks]
      summary: 'POST /test/latency - delay matching requests'
      description: '`path` matches the request path without its query string; `*` is a wildcard. Never applies to /test/* or /health.'
      servers: [{ url: / }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path, delayMs]
              properties:
                path: { type: string, example: '/api/v1/products*' }
                method: { type: string, enum: [GET, POST, PUT, PATCH, DELETE] }
                delayMs: { type: integer, minimum: 1, maximum: 60000 }
      responses:
        '201':
          description: Rule created
          content:
            application/json:
              schema: { type: object }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Test hooks]
      summary: 'DELETE /test/latency - remove every latency rule'
      servers: [{ url: / }]
      responses:
        '204':
          description: Cleared
  /test/chaos:
    get:
      tags: [Test hooks]
      summary: 'GET /test/chaos - list failure rules'
      servers: [{ url: / }]
      responses:
        '200':
          description: Rules
          content:
            application/json:
              schema: { type: object }
    post:
      tags: [Test hooks]
      summary: 'POST /test/chaos - make matching requests fail'
      description: |
        Send exactly one of `failureRate` (0-1, random) or `failNext` (fail the next N matching requests, deterministic).
        Failures use the standard error shape with code `CHAOS_INJECTED` and an `X-Chaos-Rule` header.
      servers: [{ url: / }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path: { type: string, example: /api/v1/orders }
                method: { type: string, enum: [GET, POST, PUT, PATCH, DELETE] }
                failureRate: { type: number, minimum: 0, maximum: 1 }
                failNext: { type: integer, minimum: 1, maximum: 1000 }
                status: { type: integer, minimum: 400, maximum: 599, default: 500 }
      responses:
        '201':
          description: Rule created
          content:
            application/json:
              schema: { type: object }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Test hooks]
      summary: 'DELETE /test/chaos - remove every failure rule'
      servers: [{ url: / }]
      responses:
        '204':
          description: Cleared

  /test/bugs:
    get:
      tags: [Test hooks]
      summary: 'GET /test/bugs - every named defect, whether it is on, and the AC it breaks'
      servers: [{ url: / }]
      responses:
        '200':
          description: Defects
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [name, enabled, ac, side, description]
                      properties:
                        name: { type: string }
                        enabled: { type: boolean }
                        ac: { type: string }
                        side: { type: string, description: 'Where the defect lives: api, web, api+web or payment frame' }
                        description: { type: string }
    post:
      tags: [Test hooks]
      summary: 'POST /test/bugs - switch defects on or off'
      description: Web and payment-frame defects take effect on the next page load (they read `GET /api/v1/config`).
      servers: [{ url: / }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enable: { type: array, items: { type: string }, example: [order-leak] }
                disable: { type: array, items: { type: string } }
      responses:
        '200':
          description: The defects after the change
          content:
            application/json:
              schema: { type: object }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Test hooks]
      summary: 'DELETE /test/bugs - switch every defect off'
      servers: [{ url: / }]
      responses:
        '204':
          description: All off

  /test/logs:
    get:
      tags: [Test hooks]
      summary: 'GET /test/logs - the redacted log lines for one request'
      description: |
        One JSON line per request: time, correlationId, method, route, path, status, durationMs, userId,
        testSession, the active defects, the request (query, headers, body) and, for failures, the error code
        and message. Passwords, tokens, the `Authorization` header, cookies and card details are redacted.
        Keeps the most recent 5,000 lines; `POST /test/reset` clears them. The container healthcheck
        (`GET /api/v1/health/live`) is not logged.
      servers: [{ url: / }]
      parameters:
        - name: correlationId
          in: query
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' }
      responses:
        '200':
          description: Log lines for that correlation ID (empty if none)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { type: object, additionalProperties: true }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    sessionCookie:
      type: apiKey
      in: cookie
      name: session

  parameters:
    OrderStatusFilter:
      name: status
      in: query
      schema: { $ref: '#/components/schemas/OrderStatus' }
    OrderSearch:
      name: q
      in: query
      description: Order number, customer email or customer name (admin and support)
      schema: { type: string, maxLength: 200 }
    OrderSort:
      name: sort
      in: query
      schema: { type: string, enum: [newest, oldest, total_desc, total_asc], default: newest }

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing, invalid or expired credentials
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Authenticated but not allowed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Conflict (e.g. email in use, insufficient stock, one code per order, price changed)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Too many requests
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message, details, correlationId]
          additionalProperties: false
          properties:
            code: { type: string, example: VALIDATION_ERROR }
            message: { type: string }
            correlationId:
              type: string
              description: The request's `X-Correlation-Id`, for finding its log line.
              example: 3f2b8c1e-6a0d-4c4e-9a52-1b7e2f0c9d11
            details:
              nullable: true
              description: For validation errors, an array of `{ field, message }`.
              oneOf:
                - type: array
                  items:
                    type: object
                    properties:
                      field: { type: string }
                      message: { type: string }
                - type: object
                  additionalProperties: true
    Message:
      type: object
      required: [message]
      properties:
        message: { type: string }
    Health:
      type: object
      required: [status, checks]
      properties:
        status: { type: string, enum: [ok, unavailable] }
        checks:
          type: object
          properties:
            api: { type: string, enum: [up, down] }
            db: { type: string, enum: [up, down] }
            web: { type: string, enum: [up, down] }
        testHooks: { type: boolean }
        time: { type: string, format: date-time }

    Role:
      type: string
      enum: [customer, admin, support]
    User:
      type: object
      required: [id, email, name, role, emailVerified, avatarUrl, createdAt]
      properties:
        id: { type: integer }
        email: { type: string, format: email }
        name: { type: string, maxLength: 500 }
        role: { $ref: '#/components/schemas/Role' }
        emailVerified: { type: boolean }
        avatarUrl: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    UserEnvelope:
      type: object
      required: [user]
      properties:
        user: { $ref: '#/components/schemas/User' }
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 1, maxLength: 500, example: Aoife Ní Bhriain }
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 128 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, example: customer@playlab.test }
        password: { type: string, example: Password123! }
    TokenRequest:
      type: object
      required: [token]
      properties:
        token: { type: string }
    Session:
      type: object
      required: [accessToken, refreshToken, expiresIn, tokenType, user]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer, example: 900, description: Seconds until the access token expires }
        tokenType: { type: string, enum: [Bearer] }
        user: { $ref: '#/components/schemas/User' }

    Category:
      type: object
      required: [slug, name]
      properties:
        slug: { type: string, example: electronics }
        name: { type: string, example: Electronics }
    CategoryWithCount:
      allOf:
        - $ref: '#/components/schemas/Category'
        - type: object
          required: [productCount]
          properties:
            productCount: { type: integer }
    Product:
      type: object
      required: [id, sku, name, description, category, priceCents, stock, inStock, imageUrl, images, createdAt, updatedAt]
      properties:
        id: { type: integer }
        sku: { type: string }
        name: { type: string }
        description: { type: string }
        category: { $ref: '#/components/schemas/Category' }
        priceCents: { type: integer, minimum: 0, description: 'Price excluding VAT, in cents' }
        stock: { type: integer, minimum: 0 }
        inStock: { type: boolean }
        imageUrl: { type: string }
        images:
          type: array
          description: Gallery images; the first is `imageUrl`
          items: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ProductEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Product' }
    ProductList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Product' }
        meta: { $ref: '#/components/schemas/PageMeta' }
    PageMeta:
      type: object
      required: [page, limit, total, totalPages]
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }
        sort: { type: string }
    ProductInput:
      type: object
      required: [sku, name, category, priceCents, stock]
      properties:
        sku: { type: string, maxLength: 40 }
        name: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        category: { type: string, description: Category slug }
        priceCents: { type: integer, minimum: 0 }
        stock: { type: integer, minimum: 0 }
        imageUrl: { type: string }
    ProductPatch:
      type: object
      minProperties: 1
      properties:
        sku: { type: string, maxLength: 40 }
        name: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        category: { type: string }
        priceCents: { type: integer, minimum: 0 }
        stock: { type: integer, minimum: 0 }
        imageUrl: { type: string }

    Totals:
      type: object
      required: [subtotalCents, discountCents, vatCents, deliveryCents, totalCents]
      description: |
        subtotal = sum of line totals. VAT (23%) is charged on (subtotal - goods discount).
        total = subtotal - discount + VAT + delivery, never below 0.
      properties:
        subtotalCents: { type: integer }
        discountCents: { type: integer }
        vatCents: { type: integer }
        deliveryCents: { type: integer }
        totalCents: { type: integer, minimum: 0 }
    CartItem:
      type: object
      required: [productId, sku, name, imageUrl, quantity, stock, unitPriceCents, priceAtAddCents, priceChanged, lineTotalCents]
      properties:
        productId: { type: integer }
        sku: { type: string }
        name: { type: string }
        imageUrl: { type: string }
        quantity: { type: integer, minimum: 1 }
        stock: { type: integer }
        unitPriceCents: { type: integer, description: Current price }
        priceAtAddCents: { type: integer, description: Price when the item was added }
        priceChanged: { type: boolean }
        lineTotalCents: { type: integer }
    Cart:
      type: object
      required: [id, items, itemCount, discount, discounts, totals, currency, priceChanged, notices]
      properties:
        id: { type: string }
        items:
          type: array
          items: { $ref: '#/components/schemas/CartItem' }
        itemCount: { type: integer }
        discount:
          nullable: true
          type: object
          required: [code, description, type, value, amountCents]
          properties:
            code: { type: string }
            description: { type: string }
            type: { type: string, enum: [percent, fixed] }
            value: { type: integer }
            amountCents: { type: integer }
        discounts:
          type: array
          description: The applied codes. At most one, except with the discount-stacking defect in bug mode.
          items:
            type: object
            required: [code, description, type, value, amountCents]
            properties:
              code: { type: string }
              description: { type: string }
              type: { type: string, enum: [percent, fixed] }
              value: { type: integer }
              amountCents: { type: integer }
        totals: { $ref: '#/components/schemas/Totals' }
        currency: { type: string, enum: [EUR] }
        priceChanged: { type: boolean }
        notices:
          type: array
          description: One-off messages, e.g. a discount removed because the cart fell below its minimum spend.
          items:
            type: object
            required: [code, message]
            properties:
              code: { type: string }
              message: { type: string }

    ShippingAddress:
      type: object
      required: [fullName, line1, city, postcode]
      properties:
        fullName: { type: string, maxLength: 500 }
        line1: { type: string, maxLength: 200 }
        line2: { type: string, maxLength: 200 }
        city: { type: string, maxLength: 100 }
        county: { type: string, maxLength: 100 }
        postcode: { type: string, maxLength: 20 }
        country: { type: string, minLength: 2, maxLength: 2, default: IE }
        phone: { type: string, maxLength: 30 }
    OrderRequest:
      type: object
      description: Send exactly one of `payment` or `paymentIntentId`.
      required: [shipping, deliveryDate]
      properties:
        shipping: { $ref: '#/components/schemas/ShippingAddress' }
        deliveryDate: { type: string, format: date, description: Between tomorrow and 30 days from today }
        instructions: { type: string, maxLength: 200 }
        acceptPriceChanges: { type: boolean, default: false }
        paymentIntentId: { type: string, format: uuid }
        payment:
          type: object
          required: [cardNumber, expiry, cvc, nameOnCard]
          properties:
            cardNumber: { type: string, example: '4242 4242 4242 4242' }
            expiry: { type: string, pattern: '^(0[1-9]|1[0-2])/\d{2}$', example: '12/30' }
            cvc: { type: string, example: '123' }
            nameOnCard: { type: string }
    Order:
      type: object
      required: [id, number, userId, customer, status, createdAt, items, totals, discount, currency, shipping, deliveryDate, instructions, cardLast4]
      properties:
        id: { type: integer }
        number: { type: string, example: PL-000001 }
        userId: { type: integer }
        customer:
          type: object
          required: [id, email, name]
          properties:
            id: { type: integer }
            email: { type: string }
            name: { type: string }
        status: { $ref: '#/components/schemas/OrderStatus' }
        createdAt: { type: string, format: date-time }
        items:
          type: array
          items:
            type: object
            required: [productId, name, unitPriceCents, quantity, lineTotalCents]
            properties:
              productId: { type: integer }
              name: { type: string }
              unitPriceCents: { type: integer }
              quantity: { type: integer }
              lineTotalCents: { type: integer }
        totals: { $ref: '#/components/schemas/Totals' }
        discount:
          nullable: true
          type: object
          required: [code, amountCents]
          properties:
            code: { type: string }
            amountCents: { type: integer }
        currency: { type: string, enum: [EUR] }
        shipping: { $ref: '#/components/schemas/ShippingAddress' }
        deliveryDate: { type: string, format: date, nullable: true }
        instructions: { type: string }
        cardLast4: { type: string }
    OrderEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Order' }
    OrderList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Order' }
        meta: { $ref: '#/components/schemas/PageMeta' }

    OrderStatus:
      type: string
      enum: [pending, paid, processing, shipped, delivered, cancelled]
    Tracking:
      type: object
      required: [orderId, number, status, carrier, trackingNumber, estimatedDelivery, events]
      properties:
        orderId: { type: integer }
        number: { type: string }
        status: { $ref: '#/components/schemas/OrderStatus' }
        carrier: { type: string }
        trackingNumber: { type: string, example: PLP000001IE }
        estimatedDelivery: { type: string, format: date, nullable: true }
        events:
          type: array
          items:
            type: object
            required: [status, label, at]
            properties:
              status: { type: string }
              label: { type: string }
              at: { type: string, format: date-time }
    PaymentIntent:
      type: object
      required: [id, amountCents, currency, status, cardLast4, used, createdAt]
      properties:
        id: { type: string, format: uuid }
        amountCents: { type: integer }
        currency: { type: string, enum: [EUR] }
        status: { type: string, enum: [requires_payment, processing, succeeded, declined, timed_out] }
        cardLast4: { type: string, nullable: true }
        used: { type: boolean }
        createdAt: { type: string, format: date-time }
    Wishlist:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            type: object
            required: [position, addedAt, product]
            properties:
              position: { type: integer }
              addedAt: { type: string, format: date-time }
              product: { $ref: '#/components/schemas/Product' }
        meta:
          type: object
          properties:
            count: { type: integer }

    Review:
      type: object
      required: [id, productId, rating, title, body, author, createdAt]
      properties:
        id: { type: integer }
        productId: { type: integer }
        rating: { type: integer, minimum: 1, maximum: 5 }
        title: { type: string }
        body: { type: string }
        author:
          type: object
          required: [id, name]
          properties:
            id: { type: integer }
            name: { type: string }
        createdAt: { type: string, format: date-time }
    ReviewMeta:
      type: object
      required: [count, average]
      properties:
        count: { type: integer }
        average: { type: number, nullable: true, description: Mean rating to one decimal place }
    ReviewList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Review' }
        meta: { $ref: '#/components/schemas/ReviewMeta' }
    Store:
      type: object
      required: [id, name, address, city, lat, lng, hours]
      properties:
        id: { type: string }
        name: { type: string }
        address: { type: string }
        city: { type: string }
        lat: { type: number }
        lng: { type: number }
        hours: { type: string }
    AddressSuggestion:
      type: object
      required: [id, line1, city, county, postcode, country, label]
      properties:
        id: { type: string }
        line1: { type: string }
        city: { type: string }
        county: { type: string }
        postcode: { type: string }
        country: { type: string }
        label: { type: string }
    Email:
      type: object
      required: [id, to, type, subject, body, link, createdAt]
      properties:
        id: { type: integer }
        to: { type: string }
        type: { type: string, enum: [confirm-email, password-reset] }
        subject: { type: string }
        body: { type: string }
        link: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    ClockState:
      type: object
      required: [now, offsetMs]
      properties:
        now: { type: string, format: date-time }
        offsetMs: { type: integer }
