# The performance profile (PLS-27.5). Use it on top of the normal file:
#
#   docker compose -f docker-compose.yml -f docker-compose.perf.yml up --build -d
#
# It runs the API as it would run in production (the rate limit is off, the log is quiet, the API and database have CPU and
# memory limits), and adds Prometheus and Grafana, which show the request rate, p95 latency and error rate. Test hooks stay
# on, because the data and users for a load test come from them, so PLAYLAB_ALLOW_UNSAFE is set: never expose this stack.
# (A Compose profile cannot change another service's settings, which is why this is a second file and not `--profile perf`.)
services:
  api:
    environment:
      NODE_ENV: production
      PLAYLAB_ALLOW_UNSAFE: "true"
      # Off for the load and soak tests. The overload test (PLS-27.4) needs the limit on: PERF_RATE_LIMIT_PER_MIN=600.
      RATE_LIMIT_PER_MIN: "${PERF_RATE_LIMIT_PER_MIN:-0}"
      # A one-hour soak outlives the normal 15-minute access token.
      ACCESS_TOKEN_TTL_SEC: "${PERF_ACCESS_TOKEN_TTL_SEC:-7200}"
      LOG_LEVEL: warn
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1g

  db:
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g

  prometheus:
    image: prom/prometheus:v3.5.0
    # The remote-write receiver lets k6 send its metrics here (K6_PROMETHEUS_RW_SERVER_URL=http://localhost:9091/api/v1/write).
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d", "--web.enable-remote-write-receiver"]
    volumes:
      - ./perf/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${PROMETHEUS_PORT:-9091}:9090"
    depends_on:
      api:
        condition: service_healthy

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      # Anyone on the local network can look at the dashboard without logging in.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/playlab.json
    volumes:
      - ./perf/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./perf/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3300}:3000"
    depends_on:
      - prometheus
