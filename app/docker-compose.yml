name: playlab-platform

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: playlab
      POSTGRES_PASSWORD: playlab
      POSTGRES_DB: playlab
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U playlab -d playlab"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: ./api
    environment:
      PORT: 3000
      # A local development stack. The image defaults to production, where the API refuses to start with test hooks
      # on unless PLAYLAB_ALLOW_UNSAFE=true (PLS-28.5).
      NODE_ENV: ${NODE_ENV:-development}
      PLAYLAB_ALLOW_UNSAFE: ${PLAYLAB_ALLOW_UNSAFE:-false}
      DATABASE_URL: postgres://playlab:playlab@db:5432/playlab
      WEB_URL: http://web:5173
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:${WEB_PORT:-5173}}
      TEST_HOOKS: ${TEST_HOOKS:-true}
      JWT_SECRET: ${JWT_SECRET:-playlab-dev-secret-not-for-production}
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-100}
      ACCESS_TOKEN_TTL_SEC: ${ACCESS_TOKEN_TTL_SEC:-900}
      PAYMENT_TIMEOUT_MS: ${PAYMENT_TIMEOUT_MS:-5000}
      # The payment iframe is served by the API on its own origin (cross-origin to the shop).
      PAYMENT_FRAME_URL: ${PAYMENT_FRAME_URL:-http://localhost:${API_PORT:-3000}/pay/frame}
      SHOP_ORIGINS: ${SHOP_ORIGINS:-http://localhost:${WEB_PORT:-5173}}
      # The one internal host the avatar import may fetch from (PLS-9.5). Everything else inside the network is refused (PLS-24.10).
      AVATAR_IMPORT_ALLOWED_HOSTS: fixtures
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
      fixtures:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/v1/health/live || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  # Static files the avatar import can fetch in tests (not published on a host port).
  fixtures:
    image: nginx:1.29-alpine
    volumes:
      - ./fixtures:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/avatar.png > /dev/null || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 15

  web:
    build: ./web
    environment:
      WEB_ALLOWED_HOSTS: ${WEB_ALLOWED_HOSTS:-}
      API_PROXY_TARGET: http://api:3000
      # Where the payment iframe lives, so the web app's Content-Security-Policy lets the page frame it (PLS-24.11).
      PAYMENT_FRAME_URL: ${PAYMENT_FRAME_URL:-http://localhost:${API_PORT:-3000}/pay/frame}
    ports:
      - "${WEB_PORT:-5173}:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5173/ > /dev/null || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
