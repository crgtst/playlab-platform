  /orders/bulk-status:
    post:
      description: |
        All or nothing: if any selected order can't make the change, none change and the 409 lists every one that can't
        (`details: { to, orders: [{ id, number, from, allowed }] }`). Allowed changes: `pending → paid → processing → shipped → delivered`, and cancellation from `pending`, `paid` or
        `processing`, which puts the items back in stock. Setting the status an order already has is a no-op.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_orders_bulk_status_post_request"
        required: true
      responses:
        "200":
          content:
