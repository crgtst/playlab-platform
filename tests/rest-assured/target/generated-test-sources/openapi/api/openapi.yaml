              schema:
                $ref: "#/components/schemas/Error"
          description: "Missing, invalid or expired credentials"
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Authenticated but not allowed
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: The order can't move to that status (`INVALID_TRANSITION`)
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Validation failed
      security:
      - bearerAuth: []
      - sessionCookie: []
      summary: Change the status of several orders at once (admin)
      tags:
      - Admin
      x-content-type: application/json
      x-accepts:
      - application/json
  /orders/{id}/status:
    patch:
      description: |
        Emits an `orderStatusChanged` event (delivered over WebSocket). Allowed changes: `pending → paid → processing → shipped → delivered`, and cancellation from `pending`, `paid` or
        `processing`, which puts the items back in stock. Setting the status an order already has is a no-op.
        Anything else returns 409 `INVALID_TRANSITION` with `details: { from, to, allowed }`.
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: integer
        style: simple
      - description: The `ETag` from the last `GET`. A stale one is 412; leaving it
          out is 428. `*` matches any version.
        explode: false
        in: header
        name: If-Match
        required: true
        schema:
          example: '"order-12-v3"'
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_orders__id__status_patch_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderEnvelope"
          description: Updated order
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Missing, invalid or expired credentials"
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Authenticated but not allowed
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not found
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: The order can't move to that status (`INVALID_TRANSITION`)
        "412":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`If-Match` is stale: someone else changed it first (`PRECONDITION_FAILED`)"
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Validation failed
        "428":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: '`If-Match` is missing (`PRECONDITION_REQUIRED`)'
      security:
      - bearerAuth: []
      - sessionCookie: []
      summary: Change an order's status (admin)
      tags:
      - Admin
      x-content-type: application/json
      x-accepts:
      - application/json
