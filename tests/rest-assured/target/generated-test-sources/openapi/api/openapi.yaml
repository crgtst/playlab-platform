  /orders:
    get:
      description: Customers see only their own orders. Admin and support users see
        every order and can filter them.
      parameters:
      - explode: true
        in: query
        name: status
        required: false
        schema:
          $ref: "#/components/schemas/OrderStatus"
        style: form
      - description: "Order number, customer email or customer name (admin and support)"
        explode: true
        in: query
        name: q
        required: false
        schema:
          maxLength: 200
          type: string
        style: form
      - explode: true
        in: query
        name: sort
        required: false
        schema:
          default: newest
          enum:
          - newest
          - oldest
          - total_desc
          - total_asc
          type: string
        style: form
      - explode: true
        in: query
        name: page
        required: false
        schema:
          default: 1
          minimum: 1
          type: integer
        style: form
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 20
          maximum: 100
          minimum: 1
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderList"
          description: Orders
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Missing, invalid or expired credentials"
      security:
      - bearerAuth: []
      - sessionCookie: []
      summary: "List orders, newest first"
      tags:
      - Orders
      x-accepts:
      - application/json
    post:
      description: |
        Prices always come from the database; any price sent by the client is ignored.
        Test cards: `4242 4242 4242 4242` succeeds, `4000 0000 0000 0002` is declined (402),
        `4000 0000 0000 0119` times out (504 after a delay). No order is created on 402 or 504 and the cart is kept.
        If prices changed since items were added, returns 409 `PRICE_CHANGED` unless `acceptPriceChanges` is true.
        Instead of card details you can send `paymentIntentId` for an intent confirmed in the payment iframe:
        it must be yours, succeeded, unused and for the current total (409 `PAYMENT_NOT_COMPLETED`,
        `PAYMENT_ALREADY_USED` or `PAYMENT_AMOUNT_MISMATCH` otherwise; 402 if it was declined).
      parameters:
      - description: Re-sending the same key returns the original order (200) instead
          of creating another.
        explode: false
        in: header
        name: Idempotency-Key
        required: false
        schema:
          maxLength: 255
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderEnvelope"
          description: Replay of an earlier request with the same Idempotency-Key
          headers:
            Idempotent-Replayed:
              explode: false
              schema:
                enum:
                - "true"
                type: string
              style: simple
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderEnvelope"
          description: Order created
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Bad request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Missing, invalid or expired credentials"
        "402":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Card declined
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Conflict (e.g. email in use, insufficient stock, one code\
            \ per order, price changed)"
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Validation failed
        "504":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Payment provider timed out
      security:
      - bearerAuth: []
      - sessionCookie: []
      summary: Place an order from the current cart
      tags:
      - Orders
      x-content-type: application/json
      x-accepts:
      - application/json
