components:
  headers:
    ETag:
      description: "Version of the resource, for `If-Match` (and `If-None-Match` on\
        \ product reads)"
      explode: false
      schema:
        type: string
      style: simple
  parameters:
    IfMatch:
      description: The `ETag` from the last `GET`. A stale one is 412; leaving it
        out is 428. `*` matches any version.
      explode: false
      in: header
      name: If-Match
      required: true
      schema:
        example: '"order-12-v3"'
        type: string
      style: simple
    OrderStatusFilter:
      explode: true
      in: query
      name: status
      required: false
      schema:
        $ref: "#/components/schemas/OrderStatus"
      style: form
    OrderSearch:
      description: "Order number, customer email or customer name (admin and support)"
      explode: true
      in: query
      name: q
      required: false
      schema:
        maxLength: 200
        type: string
      style: form
    OrderSort:
      explode: true
      in: query
      name: sort
      required: false
      schema:
        default: newest
        enum:
        - newest
        - oldest
        - total_desc
        - total_asc
        type: string
      style: form
  responses:
    PreconditionFailed:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: "`If-Match` is stale: someone else changed it first (`PRECONDITION_FAILED`)"
    PreconditionRequired:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: '`If-Match` is missing (`PRECONDITION_REQUIRED`)'
    BadRequest:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: Bad request
    Unauthorized:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: "Missing, invalid or expired credentials"
    Forbidden:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: Authenticated but not allowed
    NotFound:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: Not found
    Conflict:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: "Conflict (e.g. email in use, insufficient stock, one code per\
        \ order, price changed)"
    InvalidTransition:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: The order can't move to that status (`INVALID_TRANSITION`)
    ValidationError:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: Validation failed
    RateLimited:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: Too many requests
      headers:
        Retry-After:
          explode: false
          schema:
            type: integer
          style: simple
