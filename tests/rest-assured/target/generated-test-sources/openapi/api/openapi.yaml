openapi: 3.0.3
info:
  description: |
    REST API for PlayLab Shop, a practice e-commerce site built to be tested with Playwright.

    * All money values are integer cents in EUR.
    * Every error uses the same shape: `{ "error": { "code", "message", "details", "correlationId" } }`.
    * Every response has an `X-Correlation-Id` header. Send your own (1 to 64 of `A-Z a-z 0-9 - _`) to have it echoed;
      otherwise, or if it is invalid, the API generates a UUID. Errors repeat it as `error.correlationId`.
      With test hooks on, `GET /test/logs?correlationId=` returns that request's redacted log line.
    * Authenticate with `Authorization: Bearer <accessToken>` or the `session` cookie set by `/auth/login`.
    * Access tokens expire after 15 minutes; use `/auth/refresh` to get a new one.
    * Deleting an account (`DELETE /users/me`) ends all its sessions: its access tokens then return 401 `TOKEN_REVOKED`.
    * Rate limit: 100 requests a minute per user (or per IP for guests). Over the limit returns 429 with `Retry-After`.
      A guest's IP comes from `X-Forwarded-For` only when the web proxy sends it.
    * Test hooks under `/test/*` exist only when the API runs with `TEST_HOOKS=true`.
    * Test sessions: `POST /test/sessions` returns an id. Requests that send it as `X-Test-Session` (or the
      `test_session` cookie) get that session's own defects, clock, latency and chaos rules and rate-limit counters;
      hook calls with it change only that session. Requests with no session use the global state.
    * Live order status: WebSocket at `ws://<host>/ws/orders` (not describable in OpenAPI).
      Authenticate with the `session` cookie or `?token=<accessToken>`; without either the upgrade gets 401.
      Messages: `{"type":"hello","userId","role"}` on connect, then
      `{"type":"order.status","orderId","number","status","from","at"}` for your orders (admin and support: every order).
      Send `{"type":"ping"}` to get `{"type":"pong"}`.
    * Live stock: Server-Sent Events at `GET /api/v1/stock/stream`.
  title: PlayLab Shop API
  version: 1.0.0
servers:
- description: Versioned API
  url: /api/v1
tags:
- name: Health
- name: Auth
- name: Products
- name: Cart
- name: Orders
- name: Addresses
- name: Payments
- name: Users
- name: Wishlist
- name: Stores
- description: Admin-only order management. Support users can read orders but get
    403 on every change.
  name: Admin
- description: "Only available when `TEST_HOOKS=true`. Paths are relative to the server\
    \ root, not `/api/v1`."
  name: Test hooks
paths:
  /health:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
          description: Everything is up
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
          description: At least one dependency is down
      summary: "Readiness check (API, database and web app)"
      tags:
      - Health
      x-accepts:
      - application/json
  /health/live:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
          description: API and database are up
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
          description: Database is down
      summary: Liveness check (API and database only)
      tags:
      - Health
      x-accepts:
      - application/json
  /auth/register:
    post:
      description: Sends a confirmation email to the test mailbox. Does not log the
        user in.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
          description: Account created
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Conflict (e.g. email in use, insufficient stock, one code\
            \ per order, price changed)"
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Validation failed
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Too many requests
          headers:
            Retry-After:
              explode: false
              schema:
                type: integer
              style: simple
      summary: Register a customer account
      tags:
      - Auth
      x-content-type: application/json
      x-accepts:
      - application/json
  /auth/confirm-email:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
          description: Email confirmed
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Bad request
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Validation failed
      summary: Confirm an email address with the token from the confirmation email
      tags:
      - Auth
      x-content-type: application/json
      x-accepts:
      - application/json
  /auth/login:
    post:
      description: |
        Returns tokens and sets `session` and `refresh_token` cookies. Any guest cart (cookie `cart_id`)
        is merged into the account cart. After 5 failed attempts the account is locked for 15 minutes (423).
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
          description: Logged in
          headers:
            Set-Cookie:
              description: "`session` (access token) and `refresh_token` cookies,\
                \ both httpOnly"
              explode: false
              schema:
                type: string
              style: simple
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Missing, invalid or expired credentials"
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Validation failed
        "423":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Account locked
          headers:
            Retry-After:
              explode: false
              schema:
                type: integer
              style: simple
      summary: Log in
      tags:
      - Auth
      x-content-type: application/json
      x-accepts:
      - application/json
  /auth/refresh:
    post:
      description: Reads the refresh token from the body or the `refresh_token` cookie.
        Refresh tokens are single use (rotated).
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_auth_refresh_post_request"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
          description: New tokens
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Missing, invalid or expired credentials"
      summary: Exchange a refresh token for a new access token
      tags:
      - Auth
      x-content-type: application/json
      x-accepts:
      - application/json
  /auth/logout:
    post:
      description: "Revokes the refresh token and clears the session, refresh and\
        \ cart cookies."
      responses:
        "204":
          description: Logged out
      summary: Log out
      tags:
      - Auth
      x-accepts:
      - application/json
  /auth/me:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
          description: Current user
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Missing, invalid or expired credentials"
      security:
      - bearerAuth: []
      - sessionCookie: []
      summary: The current user
      tags:
      - Auth
      x-accepts:
      - application/json
  /auth/forgot-password:
    post:
      description: "Always returns 202. If the account exists, a reset link (valid\
        \ for 1 hour) is sent to the test mailbox."
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_auth_forgot_password_post_request"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
          description: Accepted
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Validation failed
      summary: Request a password reset link
      tags:
      - Auth
      x-content-type: application/json
      x-accepts:
      - application/json
  /auth/reset-password:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_auth_reset_password_post_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
          description: Password changed
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Bad request
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Validation failed
      summary: Set a new password with a reset token
      tags:
      - Auth
      x-content-type: application/json
      x-accepts:
      - application/json
  /products:
    get:
      parameters:
      - description: Case-insensitive match on name or description
        explode: true
        in: query
        name: q
        required: false
        schema:
          maxLength: 200
          type: string
        style: form
      - description: Category slug
        explode: true
        in: query
        name: category
        required: false
        schema:
          type: string
        style: form
      - description: Minimum price in euros (inclusive)
        explode: true
        in: query
        name: minPrice
        required: false
        schema:
          minimum: 0
          type: number
        style: form
      - description: Maximum price in euros (inclusive)
        explode: true
        in: query
        name: maxPrice
        required: false
        schema:
          minimum: 0
          type: number
        style: form
      - explode: true
        in: query
        name: sort
        required: false
        schema:
          default: name_asc
          enum:
          - name_asc
          - name_desc
          - price_asc
          - price_desc
          - newest
          type: string
        style: form
      - explode: true
        in: query
        name: page
        required: false
        schema:
          default: 1
          minimum: 1
          type: integer
        style: form
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 12
          maximum: 48
          minimum: 1
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductList"
          description: A page of products
          headers:
            Link:
              description: "RFC 8288 links with rel first, prev, next and last"
              explode: false
              schema:
                type: string
              style: simple
            X-Total-Count:
              explode: false
              schema:
                type: integer
              style: simple
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Validation failed
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Too many requests
          headers:
            Retry-After:
              explode: false
              schema:
                type: integer
              style: simple
      summary: "Search, filter, sort and page through products"
      tags:
      - Products
      x-accepts:
      - application/json
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductEnvelope"
          description: Created
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Missing, invalid or expired credentials"
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Authenticated but not allowed
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Conflict (e.g. email in use, insufficient stock, one code\
            \ per order, price changed)"
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Validation failed
      security:
      - bearerAuth: []
      - sessionCookie: []
      summary: Create a product (admin)
      tags:
      - Products
      x-content-type: application/json
      x-accepts:
      - application/json
  /products/{id}:
    delete:
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: integer
        style: simple
      responses:
        "204":
          description: Deleted
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Missing, invalid or expired credentials"
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Authenticated but not allowed
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not found
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Conflict (e.g. email in use, insufficient stock, one code\
            \ per order, price changed)"
      security:
      - bearerAuth: []
      - sessionCookie: []
      summary: Delete a product (admin)
      tags:
      - Products
      x-accepts:
      - application/json
    get:
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: integer
        style: simple
      - explode: false
        in: header
        name: If-None-Match
        required: false
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductEnvelope"
          description: The product
          headers:
            ETag:
              explode: false
              schema:
                type: string
              style: simple
        "304":
          description: Not modified (ETag matched)
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not found
      summary: Get one product
      tags:
      - Products
      x-accepts:
      - application/json
    patch:
      description: "Needs `If-Match` with the `ETag` from `GET /products/{id}` (PLS-21).\
        \ Any change, stock included, gives a new ETag."
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: integer
        style: simple
      - description: The `ETag` from the last `GET`. A stale one is 412; leaving it
          out is 428. `*` matches any version.
        explode: false
        in: header
        name: If-Match
        required: true
        schema:
          example: '"order-12-v3"'
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductPatch"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductEnvelope"
          description: Updated
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Missing, invalid or expired credentials"
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Authenticated but not allowed
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not found
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Conflict (e.g. email in use, insufficient stock, one code\
            \ per order, price changed)"
        "412":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`If-Match` is stale: someone else changed it first (`PRECONDITION_FAILED`)"
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Validation failed
        "428":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: '`If-Match` is missing (`PRECONDITION_REQUIRED`)'
      security:
      - bearerAuth: []
      - sessionCookie: []
      summary: Update some fields of a product (admin)
      tags:
      - Products
      x-content-type: application/json
      x-accepts:
      - application/json
    put:
      description: "Needs `If-Match` with the `ETag` from `GET /products/{id}` (PLS-21).\
        \ Any change, stock included, gives a new ETag."
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: integer
        style: simple
      - description: The `ETag` from the last `GET`. A stale one is 412; leaving it
          out is 428. `*` matches any version.
        explode: false
        in: header
        name: If-Match
        required: true
        schema:
          example: '"order-12-v3"'
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductEnvelope"
          description: Updated
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Missing, invalid or expired credentials"
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Authenticated but not allowed
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not found
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Conflict (e.g. email in use, insufficient stock, one code\
            \ per order, price changed)"
        "412":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`If-Match` is stale: someone else changed it first (`PRECONDITION_FAILED`)"
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Validation failed
        "428":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: '`If-Match` is missing (`PRECONDITION_REQUIRED`)'
      security:
      - bearerAuth: []
      - sessionCookie: []
      summary: Replace a product (admin)
      tags:
      - Products
      x-content-type: application/json
      x-accepts:
      - application/json
  /products/{productId}/reviews:
    get:
      description: "Review text is returned exactly as written. Render it as text,\
        \ never as HTML."
      parameters:
      - explode: false
        in: path
        name: productId
        required: true
        schema:
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewList"
          description: Reviews
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not found
      summary: "Reviews for a product, newest first"
      tags:
      - Products
      x-accepts:
      - application/json
    post:
      parameters:
      - explode: false
        in: path
        name: productId
        required: true
        schema:
          type: integer
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_products__productId__reviews_post_request"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_products__productId__reviews_post_201_response"
          description: Created
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Missing, invalid or expired credentials"
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not found
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Conflict (e.g. email in use, insufficient stock, one code\
            \ per order, price changed)"
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Validation failed
      security:
      - bearerAuth: []
      - sessionCookie: []
      summary: Review a product (one review per user per product)
      tags:
      - Products
      x-content-type: application/json
      x-accepts:
      - application/json
  /stock/stream:
    get:
      description: |
        A `text/event-stream`. First an `event: snapshot` with `{ products: [{ productId, stock }], at }`,
        then an `event: stock` with `{ productId, stock, at }` whenever a watched product's stock changes
        (orders, admin edits), and a `: ping` comment every 15 s. After `POST /test/reset` a fresh snapshot is sent.
      parameters:
      - description: Comma-separated product ids to watch (up to 100). Omit to watch
          every product.
        explode: true
        in: query
        name: ids
        required: false
        schema:
          example: "1,2,3"
          type: string
        style: form
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                example: |+
                  event: stock
                  data: {"productId":4,"stock":7,"at":"2026-10-20T12:00:00.000Z"}

                type: string
          description: Event stream
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Validation failed
      summary: Live stock levels (Server-Sent Events)
      tags:
      - Products
      x-accepts:
      - application/json
      - text/event-stream
  /stores:
    get:
      parameters:
      - explode: true
        in: query
        name: q
        required: false
        schema:
          maxLength: 100
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_stores_get_200_response"
          description: Stores
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Validation failed
      summary: "List stores, optionally searching by town or name"
      tags:
      - Stores
      x-accepts:
      - application/json
  /stores/nearest:
    get:
      parameters:
      - explode: true
        in: query
        name: lat
        required: true
        schema:
          maximum: 90
          minimum: -90
          type: number
        style: form
      - explode: true
        in: query
        name: lng
        required: true
        schema:
          maximum: 180
          minimum: -180
          type: number
        style: form
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 3
          maximum: 12
          minimum: 1
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_stores_nearest_get_200_response"
          description: Nearest stores
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Validation failed
      summary: "The stores nearest to a position, closest first"
      tags:
      - Stores
      x-accepts:
      - application/json
  /offers:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_offers_get_200_response"
          description: Offers
      summary: "Public, currently active discount codes"
