name: Start the stack
description: >
  Starts the PlayLab stack from app/ with Docker Compose, configured from .env.example on non-default ports (the API on 3002 and the
  web app on 5174), and waits until every service is healthy. Every pipeline that needs a running stack uses this, so the setup is
  written once. Run actions/checkout first.

inputs:
  perf:
    description: Add docker-compose.perf.yml (production mode, CPU and memory limits, Prometheus and Grafana)
    default: "false"
  rate-limit:
    description: Replaces RATE_LIMIT_PER_MIN in .env (0 switches the limit off). Empty keeps the default of 100
    default: ""
  env:
    description: Extra lines appended to app/.env, for example "ACCESS_TOKEN_TTL_SEC=7200", one for each line
    default: ""
  wait-timeout:
    description: Seconds to wait for the stack to be healthy
    default: "300"

runs:
  using: composite
  steps:
    - name: Configure the stack from .env.example on non-default ports
      shell: bash
      working-directory: app
      env:
        RATE_LIMIT: ${{ inputs.rate-limit }}
        EXTRA_ENV: ${{ inputs.env }}
      run: |
        sed -e 's/^API_PORT=.*/API_PORT=3002/' -e 's/^WEB_PORT=.*/WEB_PORT=5174/' .env.example > .env
        if [ -n "$RATE_LIMIT" ]; then
          sed -e "s/^RATE_LIMIT_PER_MIN=.*/RATE_LIMIT_PER_MIN=$RATE_LIMIT/" .env > .env.tmp && mv .env.tmp .env
        fi
        if [ -n "$EXTRA_ENV" ]; then
          printf '%s\n' "$EXTRA_ENV" >> .env
        fi

    - name: Start the stack
      shell: bash
      working-directory: app
      env:
        PERF: ${{ inputs.perf }}
        WAIT_TIMEOUT: ${{ inputs.wait-timeout }}
      run: |
        files="-f docker-compose.yml"
        if [ "$PERF" = true ]; then files="$files -f docker-compose.perf.yml"; fi
        docker compose $files up --build --detach --wait --wait-timeout "$WAIT_TIMEOUT"
