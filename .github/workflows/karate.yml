# Karate features (tests/karate) run with the Maven wrapper against a fresh Compose stack. Karate writes its own HTML report.
name: karate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  karate:
    name: Karate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Configure the stack from .env.example on non-default ports
        working-directory: app
        run: sed -e 's/^API_PORT=.*/API_PORT=3002/' -e 's/^WEB_PORT=.*/WEB_PORT=5174/' .env.example > .env

      - name: Start the stack
        working-directory: app
        run: docker compose up --build --detach --wait --wait-timeout 300

      # Locally the suite takes about 15 seconds. If Maven is still running after 5 minutes something is stuck, so print
      # what every thread is doing and stop, rather than waiting for the job's timeout with no log.
      - name: Run the features
        working-directory: tests
        run: |
          ./mvnw --batch-mode -pl karate test -Dkarate.env=ci > karate-run.log 2>&1 &
          maven=$!
          for _ in $(seq 1 60); do
            kill -0 "$maven" 2>/dev/null || break
            sleep 5
          done
          if kill -0 "$maven" 2>/dev/null; then
            echo "::error::The Karate run was still going after 5 minutes"
            for pid in $(pgrep -f surefire); do echo "--- thread dump of $pid"; jcmd "$pid" Thread.print | head -300; done
            grep -vE "DEBUG|THYMELEAF" karate-run.log | tail -150
            pkill -P "$maven" || true
            exit 1
          fi
          wait "$maven" && status=0 || status=$?
          grep -vE "DEBUG|THYMELEAF" karate-run.log | tail -60
          exit "$status"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: karate-reports
          path: tests/karate/target/karate-reports/
          retention-days: 14

      - name: Save Compose logs
        if: failure()
        working-directory: app
        run: docker compose logs --no-color > compose.log

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: compose-log
          path: app/compose.log
          retention-days: 7

      - name: Stop the stack
        if: always()
        working-directory: app
        run: docker compose down -v
