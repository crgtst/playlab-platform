# Quality gate: lint and format, typecheck, API unit tests, and API integration tests against Postgres (PLS-29.5).
# Needs no running stack. Later workflows (functional, api, contract, security, perf) start the stack.
name: quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
        env:
          HUSKY: 0 # no git hooks in CI
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:tools # the traceability script's own tests

  typecheck:
    name: Typecheck (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        app: [api, web, e2e]
    defaults:
      run:
        working-directory: app/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  api-unit:
    name: API unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/api/package-lock.json
      - run: npm ci
      - run: npm test

  api-integration:
    name: API integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: playlab
          POSTGRES_PASSWORD: playlab
          POSTGRES_DB: playlab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U playlab -d playlab"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    defaults:
      run:
        working-directory: app/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/api/package-lock.json
      - run: npm ci
      - run: npm run test:int
