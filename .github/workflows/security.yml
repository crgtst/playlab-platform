# Security checks (PLS-24):
#   owasp   the OWASP API Top 10 suite (tests/security), then the defect matrix: every defect must make its test fail
#   zap     OWASP ZAP, a baseline scan of the web app and an API scan driven by the OpenAPI file
# Both write docs/security-report.md as an artifact. Only ever run these against your own local stack.
name: security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  owasp:
    name: OWASP API Top 10 tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/security/package-lock.json

      - name: Configure the stack from .env.example on non-default ports
        working-directory: app
        run: sed -e 's/^API_PORT=.*/API_PORT=3002/' -e 's/^WEB_PORT=.*/WEB_PORT=5174/' .env.example > .env

      - name: Start the stack
        working-directory: app
        run: docker compose up --build --detach --wait --wait-timeout 300

      - name: Install the suite
        working-directory: tests/security
        run: npm ci

      - name: Run the tests
        working-directory: tests/security
        run: npx playwright test

      # Each defect is switched on in turn and its secure test must fail.
      - name: Run the defect matrix
        working-directory: tests/security
        run: npm run test:defects

      - name: Write the security report
        if: always()
        run: node tools/security-report/report.mjs

      - name: Print the API log if the run failed
        if: failure()
        working-directory: app
        run: docker compose logs --no-color --tail 200 api

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: security-owasp
          path: |
            tests/security/results/
            docs/security-report.md
          if-no-files-found: ignore

      - name: Stop the stack
        if: always()
        working-directory: app
        run: docker compose down -v

  zap:
    name: OWASP ZAP scans
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # The scanner sends thousands of requests (no rate limit), for longer than an access token normally lasts, and reaches
      # the web app as host.docker.internal.
      - name: Configure the stack from .env.example on non-default ports
        working-directory: app
        run: |
          sed -e 's/^API_PORT=.*/API_PORT=3002/' -e 's/^WEB_PORT=.*/WEB_PORT=5174/' -e 's/^RATE_LIMIT_PER_MIN=.*/RATE_LIMIT_PER_MIN=0/' .env.example > .env
          echo 'ACCESS_TOKEN_TTL_SEC=7200' >> .env
          echo 'WEB_ALLOWED_HOSTS=host.docker.internal' >> .env

      - name: Start the stack
        working-directory: app
        run: docker compose up --build --detach --wait --wait-timeout 300

      - name: Scan
        run: bash tests/security/zap/run-zap.sh

      - name: Print the API log if the run failed
        if: failure()
        working-directory: app
        run: docker compose logs --no-color --tail 200 api

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: security-zap
          path: tests/security/zap/reports/
          if-no-files-found: ignore

      - name: Stop the stack
        if: always()
        working-directory: app
        run: docker compose down -v
