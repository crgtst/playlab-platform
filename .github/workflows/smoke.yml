# Platform smoke tests (app/e2e) against a fresh Compose stack.
# The stack is configured from .env.example with non-default ports, which is itself PLS-12.5.
name: smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/e2e/package-lock.json

      - uses: ./.github/actions/start-stack

      - name: Install the smoke suite
        working-directory: app/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run the smoke suite
        working-directory: app/e2e
        run: npm test

      - name: Save Compose logs
        if: failure()
        working-directory: app
        run: docker compose logs --no-color > compose.log

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: smoke-report
          path: |
            app/e2e/playwright-report/
            app/compose.log
          retention-days: 7

      - name: Stop the stack
        if: always()
        working-directory: app
        run: docker compose down -v
