# The Playwright TypeScript suite (tests/playwright-ts) against a fresh Compose stack: the main project in parallel, then
# the tests that need the stack to themselves. Retries once in CI, and keeps the report and traces of failures.
name: playwright

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/playwright-ts/package-lock.json

      - uses: ./.github/actions/start-stack

      - name: Install the suite and Chromium
        working-directory: tests/playwright-ts
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run the tests
        working-directory: tests/playwright-ts
        run: npm test

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: |
            tests/playwright-ts/playwright-report/
            tests/playwright-ts/results/
            tests/playwright-ts/test-results/
          retention-days: 14

      - name: Save Compose logs
        if: failure()
        working-directory: app
        run: docker compose logs --no-color > compose.log

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: compose-log
          path: app/compose.log
          retention-days: 7

      - name: Stop the stack
        if: always()
        working-directory: app
        run: docker compose down -v
