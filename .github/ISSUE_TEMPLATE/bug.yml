name: Platform bug
description: Something in the platform misbehaves with every defect switched off
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Planted defects are not bugs. Check `GET /test/bugs` shows none switched on, and run `POST /test/reset`, before you report.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: A curl command or the clicks, from a fresh `docker compose up --build -d`.
    validations:
      required: true
  - type: input
    id: ac
    attributes:
      label: Acceptance criterion it breaks (if you know)
      placeholder: PLS-5.2
  - type: input
    id: env
    attributes:
      label: Your machine
      description: OS, Docker version, and whether you changed ports in `app/.env`.
